server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Явно подключаем MIME-типы, чтобы CSS всегда распознавался как CSS
    include /etc/nginx/mime.types;

    # 1. Запрещаем кэшировать index.html. 
    # Браузер всегда будет качать свежий файл с правильными названиями стилей.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 2. Для статики (шрифты, JS, CSS) отдаем 404 ошибку, если файла нет (а не index.html)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. Все остальные маршруты (для работы React Router) отправляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-запросы проксируем на gateway
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}